<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材库 · A-SOUL 素材站</title>
<link rel="stylesheet" href="assets/css/site.css">
<script>try{if(localStorage.getItem('asoul.theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
</head>
<body>

<header class="nav" data-nav></header>

<main class="wrap">
  <div class="section-head" style="padding-top:34px">
    <h2>素材库</h2>
    <p>按成员、类型、系列筛选，支持关键词搜索与收藏夹。</p>
  </div>

  <div class="toolbar">
    <div class="toolbar-row">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input type="text" id="q" placeholder="搜索表情名 / 文件名 / 标签，如「贝拉 别偷懒」">
      </div>
      <select class="picker" id="sort">
        <option value="default">默认排序</option>
        <option value="name">按名称</option>
        <option value="member">按成员</option>
        <option value="size">按体积（大 → 小）</option>
        <option value="pixels">按尺寸（大 → 小）</option>
      </select>
      <div class="seg" id="viewSeg">
        <button data-v="grid" class="on">网格</button>
        <button data-v="dense">紧凑</button>
        <button data-v="big">大图</button>
      </div>
      <button class="btn sm ghost filter-toggle" id="filterToggle">筛选 ▾</button>
    </div>

    <div class="filter-panel" id="filterPanel">
      <div class="filters" id="memberFilters"></div>
      <div class="filters" id="typeFilters"></div>
      <div class="filters" id="setFilters"></div>
    </div>
  </div>

  <div class="result-line">
    <div>共 <b id="cnt">0</b> 项素材 <span id="filterNote"></span></div>
    <div class="row-between">
      <button class="btn sm ghost" id="onlyFav">☆ 只看收藏</button>
      <button class="btn sm ghost" id="reset">重置筛选</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div id="emptyHost"></div>
</main>

<footer class="footer">
  <div>本页为粉丝自发整理的素材索引站，与 A-SOUL 制作委员会、乐华娱乐、枝江娱乐均无隶属关系。</div>
  <div>所有素材版权归原作者与版权方所有，仅供个人学习、交流与二创参考，<b>请勿用于商业用途</b>。</div>
  <div class="mt-8"><a href="about.html">来源与版权声明</a> · <a href="import.html">导入后台</a></div>
</footer>

<script src="assets/js/data.js?v=2"></script>
<script src="assets/js/core.js?v=2"></script>
<script src="assets/js/gallery.js"></script>
</body>
</html>
